<!DOCTYPE html>
<html><head><meta charset="utf-8"><meta name="viewport" content="width=1440"><title>Hero scene</title>
<style>html,body{margin:0;width:100%;height:100%;overflow:hidden;background:transparent}#c{width:100%;height:100%;display:block;outline:none;opacity:0;transition:opacity .8s}</style>
<script>
(function () { const raf = window.requestAnimationFrame.bind(window); window.requestAnimationFrame = cb => raf(t => { try { cb(t); } catch (e) {} }); })();
window.onerror = function () { return true; };
window.addEventListener('error', function (e) { e.preventDefault(); e.stopImmediatePropagation(); }, true);
window.addEventListener('unhandledrejection', function (e) { e.preventDefault(); });
// No pointer, touch or key input reaches the 3D scene (registered before Spline's own listeners).
['pointerdown', 'pointermove', 'pointerup', 'pointerover', 'pointerenter', 'mousedown', 'mousemove', 'mouseup', 'touchstart', 'touchmove', 'touchend', 'click', 'dblclick', 'contextmenu', 'keydown', 'keyup']
  .forEach(function (ev) { window.addEventListener(ev, function (e) { e.stopImmediatePropagation(); }, { capture: true }); });
</script></head>
<body><canvas id="c"></canvas>
<script type="module">
import { Application } from './vendor/spline/runtime.js';
const c = document.getElementById('c');
// Load Spline's WebAssembly helpers (Draco decoder, physics) from this site, not a CDN.
const app = new Application(c, { wasmPath: new URL('vendor/spline', location.href).href });
let SCENE = new URL('assets/hero-scene.splinecode', location.href).href; try { if (parent.__resources && parent.__resources.heroSpline) SCENE = parent.__resources.heroSpline; } catch (e) {}
await app.load(SCENE);
// Show only the hand, globe and the translucent Torus covering: the one extra object in this export is the Backdrop.
app.getAllObjects().forEach(o => { if (o.name === 'Backdrop') o.visible = false; else if (o.name === 'Torus') o.visible = true; });
window.__kept = app.getAllObjects().filter(o => o.visible).map(o => o.name + '|' + o.type);
// Page scroll passes through: the wheel scrolls the website instead of zooming the 3D camera.
window.addEventListener('wheel', e => { e.preventDefault(); e.stopImmediatePropagation(); try { parent.scrollBy({ top: e.deltaY, left: 0 }); } catch (_) {} }, { capture: true, passive: false });
try { app.setZoom && null; } catch (e) {}
try { app.setBackgroundColor('#0E0E0F'); } catch (e) {}
// Keep the hand, globe and ring fixed together in their authored pose: no mouse-follow, no
// drag-to-rotate, no touch spin. The page already gives this frame no pointer input; this also
// holds if it ever gets some. Spline's play() turns camera controls back on, so lock re-applies.
const lock = () => {
  try { app.setGlobalEvents(false); } catch (e) {}
  try { if (app._controls && app._controls.orbitControls) app._controls.orbitControls.enabled = false; } catch (e) {}
};
lock();
// Pull Spline's camera back so the whole hand + globe renders inside the 1440×900 frame.
try { app.setZoom(0.85); } catch (e) {}
window.__app = app;
// The page pauses the scene while the hero is scrolled out of view (saves battery and keeps
// the globe journey smooth on phones).
addEventListener('message', e => {
  if (!e.data || typeof e.data.heroPause !== 'boolean') return;
  try { e.data.heroPause ? app.stop() : app.play(); } catch (_) {}
  lock();
});
// Measure lit content (union over ~2 s of animation) by drawing the WebGL canvas into a small 2D grid inside rAF, then report to the parent page.
const GW = 144, GH = 90;
const g = document.createElement('canvas'); g.width = GW; g.height = GH; const gx = g.getContext('2d', { willReadFrequently: true });
let box = null, n = 0;
// Accumulate lit-pixel counts per grid cell; at the end keep only cells lit in several frames with lit neighbours, then take 3rd–97th percentile extents.
const acc = new Uint16Array(GW * GH);
const sample = () => {
  try { gx.clearRect(0, 0, GW, GH); gx.drawImage(c, 0, 0, GW, GH); } catch (e) { return; }
  const d = gx.getImageData(0, 0, GW, GH).data;
  for (let i = 0; i < GW * GH; i++) { const j = i * 4; if (Math.abs(d[j] * 0.3 + d[j + 1] * 0.59 + d[j + 2] * 0.11 - 14) > 5) acc[i]++; }
};
// Every cell lit in any frame counts (keeps the hand's sparse dots); only the outer 3% border is ignored, where stray particles drift.
const measure = () => {
  const mx = Math.ceil(GW * 0.03), my = Math.ceil(GH * 0.03);
  let x0 = GW, y0 = GH, x1 = -1, y1 = -1;
  for (let y = my; y < GH - my; y++) for (let x = mx; x < GW - mx; x++) if (acc[y * GW + x] >= 1) { if (x < x0) x0 = x; if (x > x1) x1 = x; if (y < y0) y0 = y; if (y > y1) y1 = y; }
  if (x1 < 0) return null;
  const k = innerWidth / GW, ky = innerHeight / GH;
  return { l: x0 * k, r: (x1 + 1) * k, t: y0 * ky, b: (y1 + 1) * ky };
};
const loop = () => { sample(); if (++n < 30) requestAnimationFrame(loop); else { box = measure(); window.__box = box; parent.postMessage({ heroBox: box, w: innerWidth, h: innerHeight }, '*'); } };
c.style.opacity = 1;
// Tell the page the scene is drawing so it can fade in now; the measured fit follows.
requestAnimationFrame(() => parent.postMessage({ heroReady: true }, '*'));
setTimeout(() => requestAnimationFrame(loop), 120);
</script></body></html>
